[project]
name = "clipdock-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "yt-dlp[default]>=2026.3.17", "itsdangerous>=2.2"]
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "httpx2>=2.13.1",
    "ruff>=0.16.10",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
